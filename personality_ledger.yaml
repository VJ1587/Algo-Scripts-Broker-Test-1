# ---------------------------------------------------------------- hypotheses (written behaviors)
# Each monthly review re-tests these on the latest data and logs validated / regime-dependent /
# invalidated / inconclusive. metric: a trait name, or corr:<SYMBOL> for the 60 day return correlation.
# Subjects ending in _IDX are solo currency indices (a currency against the other seven majors).
hypotheses:
  - {id: H-USD-FEAR,      subject: USD_IDX, metric: fear_beta,     expect: ">0",   text: "USD rises in global fear (the Sovereign)", source: "Doc USD profile"}
  - {id: H-JPY-HAVEN,     subject: JPY_IDX, metric: fear_beta,     expect: ">0",   text: "JPY strengthens when fear rises (the Creditor)", source: "Doc JPY profile; failed 2022-2024 per doc"}
  - {id: H-CHF-HAVEN,     subject: CHF_IDX, metric: fear_beta,     expect: ">0",   text: "CHF rises in stress (the Vault)", source: "Doc CHF profile"}
  - {id: H-AUD-RISK,      subject: AUD_IDX, metric: fear_beta,     expect: "<0",   text: "AUD falls when fear rises (the Merchant to China)", source: "Doc AUD profile"}
  - {id: H-AUD-COPPER,    subject: AUD_IDX, metric: resource_beta, expect: ">0",   text: "AUD rises with copper", source: "Doc AUD profile"}
  - {id: H-CAD-OIL,       subject: CAD_IDX, metric: resource_beta, expect: ">0",   text: "CAD strengthens with oil (the Oil Clerk)", source: "Doc CAD profile"}
  - {id: H-EUR-RATE,      subject: EURUSD,  metric: rate_beta,     expect: ">0",   text: "EUR/USD follows the EUR-US 2y yield gap", source: "Doc EUR/USD profile"}
  - {id: H-GBP-RATE,      subject: GBPUSD,  metric: rate_beta,     expect: ">0",   text: "GBP/USD follows the UK-US 2y yield gap", source: "Doc GBP profile"}
  - {id: H-USDJPY-CARRY,  subject: USDJPY,  metric: asymmetry,     expect: ">1",   text: "USD/JPY climbs slowly and collapses fast (down days larger than up days)", source: "Doc carry engine"}
  - {id: H-AUDJPY-ASYM,   subject: AUDJPY,  metric: asymmetry,     expect: ">1",   text: "AUD/JPY: slow climbs, fast collapses", source: "Doc chemistry types"}
  - {id: H-AUDNZD-RANGE,  subject: AUDNZD,  metric: conviction,    expect: "<1",   text: "AUD/NZD siblings: range bound", source: "Doc chemistry types"}
  - {id: H-NZD-SHADOW,    subject: NZDUSD,  metric: "corr:AUDUSD", expect: ">0.7", text: "NZD shadows AUD", source: "Doc NZD profile"}
  - {id: H-GOLD-DOLLAR,   subject: XAUUSD,  metric: "corr:DXY",    expect: "<0",   text: "Gold moves against the dollar", source: "Doc relationship flips (failed for long stretches per doc)"}
  - {id: H-USDJPY-YIELD,  subject: USDJPY,  metric: "corr:US10Y",  expect: ">0",   text: "USD/JPY trends with US yields", source: "Doc USD/JPY profile"}
  - {id: H-AUD-STOCKS,    subject: AUDUSD,  metric: "corr:SPX",    expect: ">0",   text: "AUD/USD rises with stocks", source: "Doc AUD profile"}
  - {id: H-USDCAD-OIL,    subject: USDCAD,  metric: "corr:WTI",    expect: "<0",   text: "USD/CAD falls when oil rises (the Oil Mirror)", source: "Doc USD/CAD profile"}
  - {id: H-DOLLAR-STOCKS, subject: DXY,     metric: "corr:SPX",    expect: "<0",   text: "The dollar falls when stocks rise (haven role)", source: "Working assumption from the doc's USD profile"}
