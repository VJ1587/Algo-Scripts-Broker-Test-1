  - id: AU-NDS-2026
    player: AU
    document: "National Defence Strategy (16 Apr 2026); US-Australia Critical Minerals Framework (Oct 2025)"
    published: "2026-04-16"
    horizon: "10 years"
    funding_ratio: null
    delivery_ratio: null
    evidence: confirmed fact
    goals:
