# Empire Game political and policy timeline
# =========================================
# Who held power, when control changed hands, and when the rules of the game changed. The evolution page lines
# these up against each instrument's personality, year by year, so a personality shift can be read next to the
# election, change of party or policy regime around it. It does not feed likelihoods.
#
# SEED NOTICE: seeded from memory on 2026-10-08, not from primary sources. Every entry is `unverified` until
# checked at the official record (government, parliament or central bank site). Entries marked `check:` are the
# ones I am least sure of. Fix a date by editing it and setting evidence: confirmed fact with a source.
#
# offices     one list per office, in order. party: null for central bank heads. end: null = in office.
#             A change of holder is a leadership change; a change of party in a head of government or state
#             office is flagged as a change of control.
# events      kind: election | control | referendum | policy | crisis | scheduled
#             control_shift: true when a different party or bloc took control of government or a chamber.
#             policy = the rules changed (rates regime, QE, pegs, tariffs, bailouts).

politics_version: "politics-1.0.0"
default_evidence: unverified
default_source: "From memory 2026-10-08; verify at the official record"

# which countries' politics bear on each instrument; FX pairs and solo indices follow their currencies
